<script>
/* "On this page" navigator: a quiet rail on the right on wide screens,
   a small floating button with a pop-up list on phones and tablets. */
(function () {
  /* Keep in-page jumps clear of the sticky top bar, whose height changes
     when the menu wraps on small screens. */
  var bar = document.querySelector(".topbar");
  function pad() {
    if (bar) document.documentElement.style.scrollPaddingTop = (bar.offsetHeight + 16) + "px";
  }
  pad();
  window.addEventListener("resize", pad);

  var main = document.getElementById("main");
  if (!main) return;
  var heads = Array.prototype.filter.call(main.querySelectorAll(".content h2"), function (h) {
    return h.textContent.trim() !== "";
  });
  if (heads.length < 3) return;

  function slug(t) {
    return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  var nav = document.createElement("nav");
  nav.className = "toc";
  nav.id = "toc";
  nav.setAttribute("aria-label", "On this page");
  var title = document.createElement("p");
  title.className = "toc__title";
  title.textContent = "On this page";
  var list = document.createElement("ol");
  list.className = "toc__list";
  nav.appendChild(title);
  nav.appendChild(list);

  var links = heads.map(function (h) {
    if (!h.id) h.id = slug(h.textContent);
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.getAttribute("data-toc") || h.textContent.trim();
    li.appendChild(a);
    list.appendChild(li);
    return a;
  });

  var fab = document.createElement("button");
  fab.type = "button";
  fab.className = "toc-fab";
  fab.setAttribute("aria-label", "Sections on this page");
  fab.setAttribute("aria-controls", "toc");
  fab.setAttribute("aria-expanded", "false");
  fab.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">' +
    '<path d="M3 4.5h12M3 9h9M3 13.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>';

  document.body.appendChild(nav);
  document.body.appendChild(fab);

  var root = document.documentElement;

  function setOpen(open) {
    nav.classList.toggle("is-open", open);
    fab.setAttribute("aria-expanded", open ? "true" : "false");
  }
  fab.addEventListener("click", function (e) {
    e.stopPropagation();
    setOpen(!nav.classList.contains("is-open"));
  });
  nav.addEventListener("click", function (e) {
    if (e.target.closest("a")) setOpen(false);
  });
  document.addEventListener("click", function (e) {
    if (nav.classList.contains("is-open") && !nav.contains(e.target)) setOpen(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setOpen(false);
  });

  /* Show the navigator once the reader is past the intro (the home hero),
     and highlight the section currently being read. */
  var hero = document.querySelector(".hero");
  var ticking = false;
  function spy() {
    ticking = false;

    var show = true;
    if (hero) {
      var r = hero.getBoundingClientRect(), top = bar ? bar.offsetHeight : 0;
      var seen = Math.min(r.bottom, window.innerHeight) - Math.max(r.top, top);
      show = seen / r.height < 0.35;
    }
    root.classList.toggle("toc-on", show);
    if (!show) setOpen(false);

    var line = window.innerHeight * 0.3, current = -1;
    for (var i = 0; i < heads.length; i++) {
      if (heads[i].getBoundingClientRect().top <= line) current = i;
    }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
      current = heads.length - 1;
    }
    links.forEach(function (a, i) {
      var on = i === current;
      a.classList.toggle("is-active", on);
      if (on) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current");
    });
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
  }, { passive: true });
  window.addEventListener("resize", spy);
  spy();
})();
</script>
